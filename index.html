<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAJAJ | Shop Management Demo</title>
<style>
:root{--blue:#0755a5;--blue2:#0b69c7;--bg:#f3f6fb;--panel:#fff;--panel2:#f7f9fc;--text:#172338;--muted:#718096;--line:#e6ebf2;--green:#15966a;--red:#d84b55;--shadow:0 8px 28px rgba(20,43,77,.07)}
[data-theme="dark"]{--bg:#0d1522;--panel:#151f2e;--panel2:#1b293a;--text:#eaf1fb;--muted:#9aabc0;--line:#29384b;--shadow:0 8px 28px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--panel);border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}
.brand{padding:4px 10px 18px;border-bottom:1px solid var(--line)}.brand img{width:175px;height:54px;object-fit:contain;object-position:left center}.brand small{display:block;color:var(--muted);letter-spacing:1.7px;font-size:9px;margin-top:5px}
.navlabel{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px;padding:0 12px 7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:rgba(7,85,165,.10);color:var(--blue)}.nav .ico{width:20px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}.sidefoot strong{display:block;font-size:12px}.sidefoot span{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0}.topbar{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--text)}.topactions{display:flex;align-items:center;gap:10px}.iconbtn,.userpill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}.userpill{display:flex;gap:9px;align-items:center}.avatar{width:29px;height:29px;background:#e3efff;color:var(--blue);border-radius:9px;display:grid;place-items:center;font-weight:800}
.content{padding:28px 30px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.heading h1{font-size:26px;margin:5px 0}.heading p{color:var(--muted);margin:0}.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text)}.danger{background:#fff0f0;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.staticon{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:rgba(7,85,165,.1);color:var(--blue);font-size:16px}.stat strong{display:block;font-size:25px;margin:12px 0 4px;letter-spacing:-.7px}.stat small{color:var(--muted)}.up{color:var(--green)!important}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.card{padding:19px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.cardhead h3{margin:0;font-size:14px}.cardhead span{font-size:11px;color:var(--muted)}
.chart{height:205px;display:flex;align-items:end;gap:12px;padding:12px 5px 0;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(34px,75%);background:linear-gradient(180deg,#3c91e6,#0755a5);border-radius:7px 7px 2px 2px;min-height:5px}.barwrap small{color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid var(--line);font-size:12px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#e8f7f1;color:#12845d}.badge.warn{background:#fff3df;color:#b87513}.badge.blue{background:#e8f1ff;color:#0755a5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text)}.tablecard{overflow:auto}.empty{text-align:center;padding:35px;color:var(--muted)}
.poslayout{display:grid;grid-template-columns:1.5fr .9fr;gap:17px}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;color:var(--text)}.product:hover{border-color:var(--blue);transform:translateY(-1px)}.product .particon{width:35px;height:35px;border-radius:10px;background:rgba(7,85,165,.1);display:grid;place-items:center;margin-bottom:10px;font-size:18px}.product b{display:block;font-size:12px}.product small{display:block;color:var(--muted);margin:4px 0}.product strong{color:var(--blue)}.cartline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:22px;height:22px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px}.totalrow{display:flex;justify-content:space-between;padding:9px 0;color:var(--muted)}.totalrow.final{font-size:18px;color:var(--text);font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:15px}
.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.notice{padding:12px 14px;background:rgba(7,85,165,.08);border-radius:10px;color:var(--muted);font-size:12px;margin-bottom:16px}
.toast{position:fixed;bottom:22px;right:22px;background:#14253b;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translateY(0)}
.mobilemenu{display:none}
@media(max-width:1000px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.poslayout{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-260px;top:0;bottom:0;width:245px;transition:.25s;box-shadow:var(--shadow)}.sidebar.open{left:0}.topbar{padding:0 15px;height:62px}.mobilemenu{display:inline-block}.content{padding:20px 14px}.heading{align-items:center}.heading h1{font-size:22px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formrow{grid-template-columns:1fr}.userpill span:last-child{display:none}}

.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.auth-card h1{margin:8px 0;font-size:24px}.auth-card p{color:var(--muted);line-height:1.5}
.auth-card label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text)}
.auth-error{color:var(--red);font-size:12px;min-height:18px;margin-top:10px}
body:not(.authenticated) .app,body:not(.authenticated) .toast{display:none}
body.authenticated #auth-screen{display:none}
</style>
</head>
<body>
<div id="auth-screen" class="auth-screen">
  <form class="auth-card" id="login-form">
    <div class="eyebrow">BAJAJ · SECURE ACCESS</div>
    <h1>Welcome back</h1>
    <p>Sign in with your BAJAJ platform account to access your workspace.</p>
    <label for="login-email">Email address</label>
    <input id="login-email" type="email" autocomplete="username" required placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required placeholder="Your password">
    <div class="auth-error" id="auth-error"></div>
    <button class="primary" id="login-button" type="submit" style="width:100%;margin-top:8px">Sign in</button>
    <p style="font-size:11px;margin-bottom:0">Access is managed by your platform administrator.</p>
  </form>
</div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/bajaj-logo.png" alt="BAJAJ logo"><small>SPARE PARTS MANAGEMENT</small></div>
  <div><div class="navlabel">WORKSPACE</div><nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="pos"><span class="ico">▣</span>Point of Sale</button>
    <button data-page="inventory"><span class="ico">▤</span>Inventory</button>
    <button data-page="sales"><span class="ico">↗</span>Sales History</button>
    <button data-page="customers"><span class="ico">♙</span>Customers & Credit</button>
    <button data-page="suppliers"><span class="ico">♧</span>Suppliers</button>
    <button data-page="reports"><span class="ico">▥</span>Reports</button>
  </nav></div>
  <div><div class="navlabel">SYSTEM</div><nav class="nav">
    <button data-page="users"><span class="ico">♧</span>User Management</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav></div>
  <div class="sidefoot"><strong>Platform Owner View</strong><span>Demo workspace · BAJAJ</span></div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobilemenu" id="menu">☰</button><div class="crumb">BAJAJ / <b id="crumb">Dashboard</b></div></div>
  <div class="topactions"><button class="iconbtn" id="theme" title="Switch theme">☾</button><button class="userpill" id="logout"><span class="avatar">A</span><span><b id="signed-in-name" style="font-size:12px">Main Admin</b><br><small class="muted">Platform Owner · Sign out</small></span></button></div>
</header>
<section class="content" id="view"></section>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bcgpkuenbdbhowpnikoj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PJKiTDpngevBjZyXI9fZCg_dLIBYCKh";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let currentShop = null;

async function initializeApp() {
  const { data, error } = await db.auth.getSession();
  if (error) console.error(error);
  if (!data.session) return;
  currentUser = data.session.user;
  await verifyWorkspace();
}

async function verifyWorkspace() {
  const { data: admin, error: adminError } = await db.from('platform_admins')
    .select('user_id').eq('user_id', currentUser.id).maybeSingle();
  if (adminError) { document.querySelector('#auth-error').textContent = adminError.message; return; }
  if (!admin) {
    await db.auth.signOut();
    document.querySelector('#auth-error').textContent = 'This account is not registered as a platform administrator.';
    return;
  }
  const { data: shops, error } = await db.from('shops').select('id,name,slug,currency').order('name');
  if (error) { document.querySelector('#auth-error').textContent = error.message; return; }
  currentShop = shops.find(s => s.slug === 'bajaj') || shops[0] || null;
  if (!currentShop) { document.querySelector('#auth-error').textContent = 'No shop is assigned to this account yet.'; return; }
  document.body.classList.add('authenticated');
  document.querySelector('#signed-in-name').textContent = currentUser.email || 'Main Admin';
  document.querySelector('.sidefoot strong').textContent = 'Main Admin · Connected';
  document.querySelector('.sidefoot span').textContent = currentShop.name + ' · Supabase connected';
  document.querySelector('#view').innerHTML = heading('DATABASE CONNECTED', 'Welcome to BAJAJ', 'Your Main Admin account has signed in successfully.') +
    '<div class="card"><h3>Secure connection established</h3><p class="muted">Your account is authenticated and the BAJAJ shop is available. We are now ready to connect inventory, checkout, customers and reporting to live records.</p><div class="notice">Connection stage only: the existing demo screens still contain sample data. Do not use them for real sales until the live modules are connected.</div><p><b>Shop:</b> ' + currentShop.name + '</p><p><b>Currency:</b> ' + currentShop.currency + '</p><p><b>Signed in as:</b> ' + (currentUser.email || currentUser.id) + '</p></div>';
}

document.querySelector('#login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.querySelector('#login-button');
  const errorBox = document.querySelector('#auth-error');
  button.disabled = true; button.textContent = 'Signing in…'; errorBox.textContent = '';
  const { data, error } = await db.auth.signInWithPassword({
    email: document.querySelector('#login-email').value.trim(),
    password: document.querySelector('#login-password').value
  });
  button.disabled = false; button.textContent = 'Sign in';
  if (error) { errorBox.textContent = error.message; return; }
  currentUser = data.user;
  await verifyWorkspace();
});

document.querySelector('#logout').addEventListener('click', async () => {
  await db.auth.signOut(); currentUser = null; currentShop = null;
  document.body.classList.remove('authenticated');
  document.querySelector('#login-password').value = '';
});

const products=[
{id:1,code:'BAJ-001',part:'Brake Shoe Set',oem:'BJA-BRK-01',category:'Brakes',price:1850,cost:1250,qty:24,icon:'⚙'},
{id:2,code:'BAJ-002',part:'Spark Plug',oem:'BJA-SPK-02',category:'Electrical',price:1200,cost:760,qty:42,icon:'✦'},
{id:3,code:'BAJ-003',part:'Air Filter',oem:'BJA-AIR-03',category:'Engine',price:950,cost:610,qty:8,icon:'▤'},
{id:4,code:'BAJ-004',part:'Clutch Plate',oem:'BJA-CLT-04',category:'Transmission',price:3200,cost:2300,qty:13,icon:'◉'},
{id:5,code:'BAJ-005',part:'Headlight Bulb',oem:'BJA-LGT-05',category:'Electrical',price:1450,cost:900,qty:4,icon:'☼'},
{id:6,code:'BAJ-006',part:'Brake Cable',oem:'BJA-CBL-06',category:'Brakes',price:780,cost:480,qty:31,icon:'⌁'}
];
let cart=[],sales=[{id:'BAJ-000124',customer:'Walk-in customer',date:'Today, 10:42 AM',total:4250,status:'Paid',method:'Cash'},{id:'BAJ-000123',customer:'Nimal Perera',date:'Today, 09:18 AM',total:3200,status:'Credit',method:'Credit'},{id:'BAJ-000122',customer:'Walk-in customer',date:'Yesterday',total:1850,status:'Paid',method:'Card'}];
let customers=[{name:'Nimal Perera',phone:'077 123 4567',balance:3200},{name:'Kamal Fernando',phone:'071 222 3344',balance:0}];
const money=n=>'LKR '+Number(n).toLocaleString('en-LK');
const $=s=>document.querySelector(s);
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({pos:'Point of Sale',inventory:'Inventory',sales:'Sales History',customers:'Customers & Credit',suppliers:'Suppliers',reports:'Reports',users:'User Management',settings:'Settings'})[p]||'Dashboard';$('#sidebar').classList.remove('open');({dashboard:dashboard,pos:pos,inventory:inventory,sales:salesPage,customers:customersPage,suppliers:suppliersPage,reports:reportsPage,users:usersPage,settings:settingsPage}[p]||dashboard)(); }
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';$('#theme').textContent=d.dataset.theme==='dark'?'☀':'☾'};
function heading(k,t,s,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${s}</p></div>${action}</div>`}
function dashboard(){ $('#view').innerHTML=heading('OVERVIEW','Good day, Main Admin 👋','Here is what is happening at BAJAJ today.','<button class="primary" onclick="page(&quot;pos&quot;)">＋ New sale</button>')+`
<div class="stats">
<div class="stat"><div class="stathead">Today's sales <span class="staticon">↗</span></div><strong>${money(92500)}</strong><small class="up">↑ 12.8% <span class="muted">vs yesterday</span></small></div>
<div class="stat"><div class="stathead">Transactions <span class="staticon">▣</span></div><strong>28</strong><small class="muted">Today's completed sales</small></div>
<div class="stat"><div class="stathead">Inventory items <span class="staticon">▤</span></div><strong>486</strong><small class="muted">Across 8 categories</small></div>
<div class="stat"><div class="stathead">Outstanding credit <span class="staticon">◷</span></div><strong>${money(18450)}</strong><small class="muted">Across 6 customers</small></div>
</div>
<div class="grid2"><div class="card"><div class="cardhead"><h3>Sales overview</h3><span>Last 7 days · Demo data</span></div><div class="chart">${[42,60,51,76,62,88,70].map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v}%"></div><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div>`).join('')}</div></div>
<div class="card"><div class="cardhead"><h3>Stock alerts</h3><span>Needs attention</span></div>
${products.filter(p=>p.qty<10).map(p=>`<div class="cartline"><div><b>${p.part}</b><div class="muted">${p.code}</div></div><span class="badge warn">${p.qty} left</span></div>`).join('')}
<div style="margin-top:14px"><button class="secondary" onclick="page('inventory')">View inventory →</button></div></div></div>
<div class="card" style="margin-top:17px"><div class="cardhead"><h3>Recent transactions</h3><button class="secondary" onclick="page('sales')">View all</button></div>${salesTable(sales.slice(0,3))}</div>`}
function salesTable(rows){return `<table><thead><tr><th>Receipt</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.customer}</td><td class="muted">${s.date}</td><td><b>${money(s.total)}</b></td><td><span class="badge ${s.status==='Credit'?'warn':''}">${s.status}</span></td></tr>`).join('')}</tbody></table>`}
function inventory(){ $('#view').innerHTML=heading('STOCK CONTROL','Inventory','Manage Bajaj spare parts, part numbers, prices and stock levels.','<button class="primary" onclick="addProduct()">＋ Add product</button>')+`<div class="toolbar"><input class="search" id="invsearch" placeholder="Search product, code or part number…" oninput="filterInventory()"><button class="secondary" onclick="toast('CSV import will be connected in the full build.')">Import CSV</button><button class="secondary" onclick="toast('Demo inventory export prepared.')">Export</button></div><div class="card tablecard" id="invtable">${inventoryTable(products)}</div>`}
function inventoryTable(rows){return `<table><thead><tr><th>Product</th><th>Product code</th><th>Part number</th><th>Category</th><th>Cost</th><th>Selling price</th><th>Stock</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${p.part}</b></td><td>${p.code}</td><td class="muted">${p.oem}</td><td>${p.category}</td><td>${money(p.cost)}</td><td><b>${money(p.price)}</b></td><td><span class="badge ${p.qty<10?'warn':''}">${p.qty}</span></td></tr>`).join('')}</tbody></table>`}
function filterInventory(){let q=$('#invsearch').value.toLowerCase();$('#invtable').innerHTML=inventoryTable(products.filter(p=>(p.part+p.code+p.oem+p.category).toLowerCase().includes(q)))}
function addProduct(){let name=prompt('Product name');if(!name)return;let code='BAJ-'+String(products.length+1).padStart(3,'0');products.push({id:Date.now(),code,part:name,oem:'—',category:'General',price:0,cost:0,qty:0,icon:'⚙'});inventory()}
function pos(){ $('#view').innerHTML=heading('CHECKOUT','Point of Sale','Search or scan a product, add it to the cart and complete the sale.')+`<div class="poslayout"><div class="card"><div class="toolbar"><input class="search" id="possearch" placeholder="Search name, product code or barcode…" oninput="filterPOS()"></div><div class="productgrid" id="productgrid">${productCards(products)}</div></div><div class="card"><div class="cardhead"><h3>Current order</h3><span id="cartcount">0 items</span></div><div class="field"><label>Customer</label><select id="customer"><option>Walk-in customer</option>${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div id="cartlines" style="margin:12px 0"><div class="empty">Your cart is empty</div></div><div class="totalrow"><span>Subtotal</span><b id="subtotal">${money(0)}</b></div><div class="totalrow"><span>Discount</span><b>${money(0)}</b></div><div class="totalrow final"><span>Total</span><span id="total">${money(0)}</span></div><div class="field" style="margin:12px 0"><label>Payment method</label><select id="payment"><option>Cash</option><option>Card</option><option>Credit (owner approval)</option></select></div><button class="primary" style="width:100%" onclick="checkout()">Complete sale</button><p class="muted" style="font-size:10px;line-height:1.5">Credit sales require owner approval. Demo only — no real payment is processed.</p></div></div>`;renderCart()}
function productCards(rows){return rows.map(p=>`<button class="product" onclick="addCart(${p.id})"><div class="particon">${p.icon}</div><b>${p.part}</b><small>${p.code} · Stock ${p.qty}</small><strong>${money(p.price)}</strong></button>`).join('')}
function filterPOS(){let q=$('#possearch').value.toLowerCase();$('#productgrid').innerHTML=productCards(products.filter(p=>(p.part+p.code+p.oem).toLowerCase().includes(q)))}
function addCart(id){let p=products.find(x=>x.id===id);if(!p||p.qty<1){toast('This item is out of stock.');return}let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.qty){toast('Not enough stock.');return}x.qty++}else cart.push({id,qty:1});renderCart()}
function changeQty(id,d){let x=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);if(x&&x.qty>p.qty){x.qty=p.qty;toast('Not enough stock.')}renderCart()}
function renderCart(){let el=$('#cartlines');if(!el)return;el.innerHTML=cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);return `<div class="cartline"><div><b>${p.part}</b><div class="muted">${money(p.price)} each</div></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button>${x.qty}<button onclick="changeQty(${p.id},1)">+</button></div><b>${money(p.price*x.qty)}</b></div>`}).join(''):'<div class="empty">Your cart is empty</div>';let total=cart.reduce((a,x)=>a+products.find(p=>p.id===x.id).price*x.qty,0);$('#cartcount').textContent=cart.reduce((a,x)=>a+x.qty,0)+' items';$('#subtotal').textContent=money(total);$('#total').textContent=money(total)}
function checkout(){if(!cart.length){toast('Add products to the cart first.');return}let method=$('#payment').value;if(method.startsWith('Credit')){let ok=confirm('Demo owner approval: approve this credit sale?');if(!ok){toast('Credit sale not approved.');return}}let total=cart.reduce((a,x)=>a+products.find(p=>p.id===x.id).price*x.qty,0);cart.forEach(x=>products.find(p=>p.id===x.id).qty-=x.qty);let customer=$('#customer').value;let id='BAJ-'+String(125+sales.length).padStart(6,'0');sales.unshift({id,customer,date:'Just now',total,status:method.startsWith('Credit')?'Credit':'Paid',method});if(method.startsWith('Credit')){let c=customers.find(c=>c.name===customer);if(c)c.balance+=total;else customers.push({name:customer,phone:'—',balance:total})}cart=[];toast('Demo sale completed · '+id);pos()}
function salesPage(){ $('#view').innerHTML=heading('TRANSACTIONS','Sales history','Review completed sales and payment status.')+`<div class="toolbar"><input class="search" placeholder="Search receipt or customer…" oninput="filterSales(this.value)"></div><div class="card tablecard" id="salestable">${salesTable(sales)}</div>`}
function filterSales(q){$('#salestable').innerHTML=salesTable(sales.filter(s=>(s.id+s.customer+s.status).toLowerCase().includes(q.toLowerCase())))}
function customersPage(){ $('#view').innerHTML=heading('CUSTOMER ACCOUNTS','Customers & credit','Track customer balances, credit sales and repayments.')+`<div class="stats"><div class="stat"><div class="stathead">Outstanding credit</div><strong>${money(customers.reduce((a,c)=>a+c.balance,0))}</strong><small class="muted">Demo balance</small></div><div class="stat"><div class="stathead">Customer accounts</div><strong>${customers.length}</strong><small class="muted">Registered customers</small></div></div><div class="card tablecard"><table><thead><tr><th>Customer</th><th>Phone</th><th>Outstanding balance</th><th>Action</th></tr></thead><tbody>${customers.map((c,i)=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td><b>${money(c.balance)}</b></td><td><button class="secondary" onclick="repay(${i})">Record repayment</button></td></tr>`).join('')}</tbody></table></div>`}
function repay(i){let n=Number(prompt('Repayment amount (LKR):'));if(!n||n<=0)return;customers[i].balance=Math.max(0,customers[i].balance-n);toast('Demo repayment recorded.');customersPage()}
function suppliersPage(){ $('#view').innerHTML=heading('PURCHASING','Suppliers','Keep supplier contacts and purchasing details in one place.','<button class="primary" onclick="toast(&quot;Supplier form will be added next.&quot;)">＋ Add supplier</button>')+`<div class="card"><div class="empty">No suppliers added yet.<br><small>Supplier records can be created when the shop starts entering stock.</small></div></div>`}
function reportsPage(){ $('#view').innerHTML=heading('BUSINESS INSIGHTS','Reports','Sales, gross profit, stock value and outstanding credit.')+`<div class="stats"><div class="stat"><div class="stathead">Gross sales</div><strong>${money(284500)}</strong><small class="muted">Demo period</small></div><div class="stat"><div class="stathead">Estimated gross profit</div><strong>${money(68400)}</strong><small class="muted">Based on sample costs</small></div><div class="stat"><div class="stathead">Stock value (cost)</div><strong>${money(1250000)}</strong><small class="muted">Sample figure</small></div><div class="stat"><div class="stathead">Credit outstanding</div><strong>${money(customers.reduce((a,c)=>a+c.balance,0))}</strong><small class="muted">Sample figure</small></div></div><div class="notice">These are illustrative demo figures. Live reports will calculate from actual shop transactions.</div><div class="card"><h3>Report sections</h3><p class="muted">Daily sales · Monthly sales · Product performance · Gross profit · Stock movement · Customer balances · Payment methods</p></div>`}
function usersPage(){ $('#view').innerHTML=heading('ACCESS CONTROL','User management','Three permission levels, with you as the platform owner.')+`<div class="grid2"><div class="card"><div class="cardhead"><h3>Platform owner</h3><span class="badge blue">You</span></div><h2>Main Admin</h2><p class="muted">Cross-shop platform access, shop management and system oversight.</p></div><div class="card"><div class="cardhead"><h3>Shop access roles</h3></div><div class="cartline"><b>Sub-admin</b><span class="badge">Shop manager</span></div><div class="cartline"><b>POS user</b><span class="badge warn">Cashier</span></div><p class="muted">Role permissions will be enforced by the secure backend in the production version.</p></div></div><div class="notice" style="margin-top:16px">Demo login is visual only. Real authentication, invitations and audit logs are not connected yet.</div>`}
function settingsPage(){ $('#view').innerHTML=heading('PREFERENCES','Settings','Configure the BAJAJ workspace.')+`<div class="card"><h3>Business profile</h3><div class="formrow"><div class="field"><label>Business display name</label><input value="BAJAJ"></div><div class="field"><label>Currency</label><input value="LKR — Sri Lankan Rupee" disabled></div><div class="field"><label>Receipt prefix</label><input value="BAJ"></div><div class="field"><label>Theme</label><input value="Dark / Light" disabled></div></div><button class="primary" onclick="toast('Settings are demo-only for now.')">Save changes</button></div><div class="card" style="margin-top:15px"><h3>Hardware compatibility</h3><p class="muted">USB barcode scanner · ESC/POS thermal receipt printer · PDF receipt export · WhatsApp sharing (production integration)</p></div>`}
initializeApp();
</script>
</body></html>
