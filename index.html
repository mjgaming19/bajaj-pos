<style>
:root{--blue:#0755a5;--blue2:#0b69c7;--bg:#f3f6fb;--panel:#fff;--panel2:#f7f9fc;--text:#172338;--muted:#718096;--line:#e6ebf2;--green:#15966a;--red:#d84b55;--shadow:0 8px 28px rgba(20,43,77,.07)}

.main{flex:1;min-width:0}.topbar{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--text)}.topactions{display:flex;align-items:center;gap:10px}.iconbtn,.userpill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}.userpill{display:flex;gap:9px;align-items:center}.avatar{width:29px;height:29px;background:#e3efff;color:var(--blue);border-radius:9px;display:grid;place-items:center;font-weight:800}
.content{padding:28px 30px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.heading h1{font-size:26px;margin:5px 0}.heading p{color:var(--muted);margin:0}.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue2)}.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text)}.danger{background:#fff0f0;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.staticon{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:rgba(7,85,165,.1);color:var(--blue);font-size:16px}.stat strong{display:block;font-size:25px;margin:12px 0 4px;letter-spacing:-.7px}.stat small{color:var(--muted)}.up{color:var(--green)!important}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.card{padding:19px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.cardhead h3{margin:0;font-size:14px}.cardhead span{font-size:11px;color:var(--muted)}
.chart{height:205px;display:flex;align-items:end;gap:12px;padding:12px 5px 0;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(34px,75%);background:linear-gradient(180deg,#3c91e6,#0755a5);border-radius:7px 7px 2px 2px;min-height:5px}.barwrap small{color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid var(--line);font-size:12px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#e8f7f1;color:#12845d}.badge.warn{background:#fff3df;color:#b87513}.badge.blue{background:#e8f1ff;color:#0755a5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text)}.tablecard{overflow:auto}.empty{text-align:center;padding:35px;color:var(--muted)}
.poslayout{display:grid;grid-template-columns:1.5fr .9fr;gap:17px}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;color:var(--text)}.product:hover{border-color:var(--blue);transform:translateY(-1px)}.product .particon{width:35px;height:35px;border-radius:10px;background:rgba(7,85,165,.1);display:grid;place-items:center;margin-bottom:10px;font-size:18px}.product b{display:block;font-size:12px}.product small{display:block;color:var(--muted);margin:4px 0}.product strong{color:var(--blue)}.cartline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:22px;height:22px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px}.totalrow{display:flex;justify-content:space-between;padding:9px 0;color:var(--muted)}.totalrow.final{font-size:18px;color:var(--text);font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:15px}
.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.notice{padding:12px 14px;background:rgba(7,85,165,.08);border-radius:10px;color:var(--muted);font-size:12px;margin-bottom:16px}
.receipt-paper{max-width:420px;margin:18px auto;background:#fff;color:#111;padding:24px;border:1px solid #ddd;font:12px Arial,sans-serif}.receipt-paper h2,.receipt-paper p{text-align:center;margin:5px 0}.receipt-paper table{margin:14px 0}.receipt-paper th,.receipt-paper td{color:#111;border-bottom:1px dashed #bbb;padding:7px 3px;font-size:11px}.receipt-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.receipt-logo{display:block;max-width:130px;max-height:55px;object-fit:contain;margin:0 auto 10px}.pos-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.pos-tools .search{min-width:0}@media print{body *{visibility:hidden!important}#receipt-preview,#receipt-preview *{visibility:visible!important}#receipt-preview{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;border:0;box-shadow:none}.receipt-actions{display:none!important}.receipt-paper{border:0;margin:0 auto;max-width:80mm;padding:4mm}}
.toast{position:fixed;bottom:22px;right:22px;background:#14253b;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translateY(0)}
.mobilemenu{display:none}
@media(max-width:1000px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.poslayout{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-260px;top:0;bottom:0;width:245px;transition:.25s;box-shadow:var(--shadow)}.sidebar.open{left:0}.topbar{padding:0 15px;height:62px}.mobilemenu{display:inline-block}.content{padding:20px 14px}.heading{align-items:center}.heading h1{font-size:22px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formrow{grid-template-columns:1fr}.userpill span:last-child{display:none}}

.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.auth-card h1{margin:8px 0;font-size:24px}.auth-card p{color:var(--muted);line-height:1.5}
.auth-card label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text)}
.auth-error{color:var(--red);font-size:12px;min-height:18px;margin-top:10px}
body:not(.authenticated) .app,body:not(.authenticated) .toast{display:none}
body.authenticated #auth-screen{display:none}
body.authenticated .nav button:disabled{opacity:.4;pointer-events:none;cursor:not-allowed}
</style>

<body>
<div id="auth-screen" class="auth-screen">
  <form class="auth-card" id="login-form">
    <div class="eyebrow">BAJAJ · SECURE ACCESS</div>
    <h1>Welcome back</h1>
    <p>Sign in with your BAJAJ platform account to access your workspace.</p>
    <label for="login-email">Email address</label>
    <input id="login-email" type="email" autocomplete="username" required placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required placeholder="Your password">
    <div class="auth-error" id="auth-error"></div>
    <button class="primary" id="login-button" type="submit" style="width:100%;margin-top:8px">Sign in</button>
    <p style="font-size:11px;margin-bottom:0">Access is managed by your platform administrator.</p>
  </form>
</div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/bajaj-logo.png" alt="BAJAJ logo"><small>SPARE PARTS MANAGEMENT</small></div>
  <div><div class="navlabel">WORKSPACE</div><nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="pos"><span class="ico">▣</span>Point of Sale</button>
    <button data-page="shifts"><span class="ico">◷</span>Cashier Shifts</button>
    <button data-page="inventory"><span class="ico">▤</span>Inventory</button>
    <button data-page="sales"><span class="ico">↗</span>Sales History</button>
    <button data-page="customers"><span class="ico">♙</span>Customers & Credit</button>
    <button data-page="suppliers"><span class="ico">♧</span>Suppliers</button>
    <button data-page="reports"><span class="ico">▥</span>Reports</button>
  </nav></div>
  <div><div class="navlabel">SYSTEM</div><nav class="nav">
    <button data-page="shops"><span class="ico">▣</span>Shop Management</button>
    <button data-page="users"><span class="ico">♧</span>User Management</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav></div>
  <div class="sidefoot"><strong>Platform Owner View</strong><span>Demo workspace · BAJAJ</span></div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobilemenu" id="menu">☰</button><div class="crumb">BAJAJ / <b id="crumb">Dashboard</b></div></div>
  <div class="topactions"><button class="iconbtn" id="theme" title="Switch theme">☾</button><button class="userpill" id="logout"><span class="avatar">A</span><span><b id="signed-in-name" style="font-size:12px">Main Admin</b><br><small class="muted">Platform Owner · Sign out</small></span></button></div>
</header>
<section class="content" id="view"></section>
</main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bcgpkuenbdbhowpnikoj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PJKiTDpngevBjZyXI9fZCg_dLIBYCKh";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let currentShop = null;
let currentUserRole = 'pos_user';
let isPlatformAdmin = false;

async function initializeApp() {
  const { data, error } = await db.auth.getSession();
  if (error) console.error(error);
  if (!data.session) return;
  currentUser = data.session.user;
  await verifyWorkspace();
}

async function loadLiveInventory() {
  const { data, error } = await db.from('products')
    .select('id,product_code,barcode,product_name,category,quantity,cost_price,selling_price,low_stock_threshold')
    .eq('shop_id', currentShop.id)
    .order('product_name');
  if (error) throw error;
  return data || [];
}

function safeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function liveInventoryMarkup(rows) {
  if (!rows.length) return '<div class="empty">No products yet. Add your first BAJAJ spare part below.</div>';
  return '<div class="tablecard"><table><thead><tr><th>Product</th><th>Product code</th><th>Barcode</th><th>Category</th><th>Cost price</th><th>Selling price</th><th>Quantity</th><th>Actions</th></tr></thead><tbody>' +
    rows.map(p => '<tr><td><b>' + safeText(p.product_name) + '</b></td><td>' + safeText(p.product_code) +
    '</td><td>' + safeText(p.barcode || '—') + '</td><td>' + safeText(p.category || '—') + '</td><td>' + money(Number(p.cost_price || 0)) +
    '</td><td><b>' + money(Number(p.selling_price || 0)) + '</b></td><td><span class="badge ' +
    (Number(p.quantity || 0) <= Number(p.low_stock_threshold ?? 5) ? 'warn' : '') + '">' + Number(p.quantity || 0) +
    '</span></td><td><button class="secondary" onclick="editLiveProduct(\'' + safeText(p.id) + '\')">Edit details</button> <button class="secondary" onclick="adjustLiveStock(\'' + safeText(p.id) + '\')">Adjust stock</button> <button class="danger" onclick="deleteLiveProduct(\'' + safeText(p.id) + '\')">Delete</button></td></tr>').join('') +
    '</tbody></table></div>';
}

async function addLiveProduct(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const message = document.querySelector('#product-form-message');
  const values = Object.fromEntries(new FormData(form).entries());
  const payload = {
    shop_id: currentShop.id,
    barcode: values.barcode.trim() || null,
    product_code: values.product_code.trim(),
    product_name: values.product_name.trim(),
    category: values.category.trim() || null,
    quantity: Number(values.quantity),
    low_stock_threshold: Number(values.low_stock_threshold || 5),
    cost_price: Number(values.cost_price),
    selling_price: Number(values.selling_price)
  };
  if (!payload.product_code || !payload.product_name || !Number.isFinite(payload.quantity) || payload.quantity < 0 || !Number.isInteger(payload.low_stock_threshold) || payload.low_stock_threshold < 0 || !Number.isFinite(payload.cost_price) || payload.cost_price < 0 || !Number.isFinite(payload.selling_price) || payload.selling_price < 0) {
    message.textContent = 'Please enter valid product details and non-negative numbers.';
    return;
  }
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true; button.textContent = 'Saving…'; message.textContent = '';
  const { error } = await db.from('products').insert(payload);
  button.disabled = false; button.textContent = '＋ Save product';
  if (error) { message.textContent = 'Could not save product: ' + error.message; return; }
  form.reset(); form.elements.quantity.value = 0;
  message.textContent = 'Product saved successfully.';
  await refreshLiveInventory();
}

async function editLiveProduct(id) {
  const { data: product, error: readError } = await db.from('products').select('*').eq('id', id).eq('shop_id', currentShop.id).single();
  if (readError) { alert('Could not load product: ' + readError.message); return; }
  const product_code = prompt('Product code:', product.product_code || ''); if (product_code === null) return;
  const product_name = prompt('Product name:', product.product_name || ''); if (product_name === null) return;
  const barcode = prompt('Barcode (optional):', product.barcode || ''); if (barcode === null) return;
  const category = prompt('Category:', product.category || ''); if (category === null) return;
  const low_stock_threshold = prompt('Low-stock alert threshold:', product.low_stock_threshold ?? 5); if (low_stock_threshold === null) return;
  const cost_price = prompt('Cost price (LKR):', product.cost_price ?? 0); if (cost_price === null) return;
  const selling_price = prompt('Selling price (LKR):', product.selling_price ?? 0); if (selling_price === null) return;
  const update = { product_code: product_code.trim(), barcode: barcode.trim() || null, product_name: product_name.trim(), category: category.trim() || null, low_stock_threshold: Number(low_stock_threshold), cost_price: Number(cost_price), selling_price: Number(selling_price) };
  if (!update.product_code || !update.product_name || !Number.isInteger(update.low_stock_threshold) || update.low_stock_threshold < 0 || !Number.isFinite(update.cost_price) || update.cost_price < 0 || !Number.isFinite(update.selling_price) || update.selling_price < 0) { alert('Please enter valid details and non-negative prices and threshold.'); return; }
  const { error } = await db.from('products').update(update).eq('id', id).eq('shop_id', currentShop.id);
  if (error) { alert('Could not update product: ' + error.message); return; }
  toast('Product details updated.'); await refreshLiveInventory();
}

async function adjustLiveStock(id) {
  const { data: product, error } = await db.from('products').select('id,product_name,quantity').eq('id', id).eq('shop_id', currentShop.id).single();
  if (error) { alert('Could not load product: ' + error.message); return; }
  const raw = prompt('Stock change for ' + product.product_name + ' (use + to add, - to remove):', '0');
  if (raw === null) return;
  const quantity_change = Number(raw);
  if (!Number.isInteger(quantity_change) || quantity_change === 0) { alert('Enter a non-zero whole number, such as 5 or -2.'); return; }
  const reason = prompt('Reason for this stock adjustment (required):', 'Stock count correction');
  if (reason === null) return;
  if (!reason.trim()) { alert('A reason is required.'); return; }
  const { data: result, error: rpcError } = await db.rpc('adjust_stock', { p_product_id: id, p_quantity_change: quantity_change, p_reason: reason.trim() });
  if (rpcError) { alert('Stock adjustment failed: ' + rpcError.message); return; }
  toast('Stock adjusted. New quantity: ' + (result?.new_quantity ?? 'updated'));
  await refreshLiveInventory();
}

async function deleteLiveProduct(id) {
  if (!confirm('Delete this product? This cannot be undone.')) return;
  const { error } = await db.from('products').delete().eq('id', id).eq('shop_id', currentShop.id);
  if (error) { alert('Could not delete product: ' + error.message); return; }
  await refreshLiveInventory();
}

async function refreshLiveInventory() {
  const target = document.querySelector('#live-inventory');
  if (!target) return;
  target.innerHTML = '<p class="muted">Loading live inventory…</p>';
  try {
    const rows = await loadLiveInventory();
    cachedLiveInventory = rows;
    target.innerHTML = liveInventoryMarkup(rows);
    const low = rows.filter(p => Number(p.quantity || 0) <= Number(p.low_stock_threshold ?? 5));
    const lowHost = document.querySelector('#live-low-stock');
    if (lowHost) lowHost.innerHTML = low.length ? '<div class="notice"><b>' + low.length + ' low-stock product(s).</b> ' + low.slice(0,5).map(p => safeText(p.product_name) + ' (' + Number(p.quantity||0) + ')').join(' · ') + (low.length>5?' · and more':'') + '</div>' : '<div class="notice">All products are above their low-stock thresholds.</div>';
    const count = document.querySelector('#live-product-count');
    if (count) count.textContent = rows.length;
  } catch (error) {
    target.innerHTML = '<div class="notice">Could not load inventory: ' + safeText(error.message) + '</div>';
  }
}

async function verifyWorkspace() {
  const errorBox = document.querySelector('#auth-error');
  const { data: admin, error: adminError } = await db.from('platform_admins').select('user_id').eq('user_id', currentUser.id).maybeSingle();
  if (adminError) { errorBox.textContent = adminError.message; return; }
  isPlatformAdmin = !!admin;
  let shops = [];
  if (isPlatformAdmin) {
    const { data, error } = await db.from('shops').select('id,name,slug,currency').order('name');
    if (error) { errorBox.textContent = error.message; return; }
    shops = data || []; currentUserRole = 'platform_admin';
  } else {
    const { data: memberships, error: memberError } = await db.from('shop_members').select('shop_id,role').eq('user_id', currentUser.id);
    if (memberError) { errorBox.textContent = memberError.message; return; }
    if (!memberships?.length) { await db.auth.signOut(); errorBox.textContent = 'This account has not been assigned to a BAJAJ shop. Ask your shop administrator for access.'; return; }
    const { data, error } = await db.from('shops').select('id,name,slug,currency').in('id', memberships.map(m => m.shop_id)).order('name');
    if (error) { errorBox.textContent = error.message; return; }
    shops = data || [];
    const selected = memberships.find(m => shops.some(s => s.id === m.shop_id));
    currentUserRole = selected?.role || 'pos_user';
    currentShop = shops.find(s => s.id === selected?.shop_id) || null;
  }
  if (!currentShop) currentShop = shops.find(s => s.slug === 'bajaj') || shops[0] || null;
  if (!currentShop) { errorBox.textContent = 'No accessible shop was found for this account.'; return; }
  const permissions = {platform_admin:['dashboard','pos','shifts','inventory','sales','customers','suppliers','reports','shops','users','settings'],sub_admin:['dashboard','pos','shifts','inventory','sales','customers','suppliers','reports','users','settings'],pos_user:['dashboard','pos','shifts','sales']};
  const allowed = permissions[currentUserRole] || permissions.pos_user;
  document.body.classList.add('authenticated');
  document.querySelectorAll('.nav button').forEach(button => { button.disabled = !allowed.includes(button.dataset.page); button.hidden = !allowed.includes(button.dataset.page); });
  document.querySelector('#signed-in-name').textContent = currentUser.email || 'BAJAJ User';
  document.querySelector('.sidefoot strong').textContent = isPlatformAdmin ? 'Main Admin · Connected' : (currentUserRole === 'sub_admin' ? 'Sub-admin · Connected' : 'POS User · Connected');
  document.querySelector('.sidefoot span').textContent = currentShop.name + ' · Supabase connected';
  await page('dashboard');
}

function addCart(id) {
  const p = livePosProducts.find(x => String(x.id) === String(id));
  if (!p || Number(p.quantity) < 1) { toast('This item is out of stock.'); return; }
  const item = cart.find(x => String(x.id) === String(id));
  const already = item ? item.qty : 0;
  if (already >= Number(p.quantity)) { toast('Not enough stock.'); return; }
  if (item) item.qty++; else cart.push({id:p.id,qty:1});
  renderCart();

function changeQty(id, delta) {
  const item = cart.find(x => String(x.id) === String(id));
  const p = livePosProducts.find(x => String(x.id) === String(id));
  if (!item || !p) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(x => String(x.id) !== String(id));
  if (item && item.qty > Number(p.quantity)) { item.qty = Number(p.quantity); toast('Not enough stock.'); }
  renderCart();
}

async function checkout() {
  if (!cart.length) { toast('Add products to the cart first.'); return; }
  const button=$('#checkout-button'),message=$('#checkout-message');
  const paymentMethod=$('#payment').value,customerId=$('#pos-customer').value||null;
  const subtotal=getCartSubtotal(),discount=getDiscount(),total=Math.max(0,subtotal-discount);
  if(paymentMethod==='credit'&&!customerId){message.textContent='Select a registered customer before creating a credit sale.';toggleCreditCustomer();return;}
  if(paymentMethod==='cash'){
    const {data:openShift,error:shiftError}=await db.from('cashier_shifts').select('id').eq('shop_id',currentShop.id).eq('cashier_id',currentUser.id).eq('status','open').maybeSingle();

    if(!openShift){message.textContent='Open a cashier shift before accepting cash. Go to Cashier Shifts to enter your opening cash.';return;}
  }
  if(discount>subtotal){message.textContent='Discount cannot exceed the subtotal.';return;}
  if(paymentMethod==='cash'){
    const tendered=Number($('#cash-tendered')?.value||0);
    if(!Number.isFinite(tendered)||tendered<total){message.textContent='Cash received must be at least the sale total.';return;}
  }
  const soldItems=cart.map(x=>{const p=livePosProducts.find(y=>String(y.id)===String(x.id));return {id:x.id,name:p?.product_name||'Product',code:p?.product_code||'',qty:x.qty,unitPrice:Number(p?.selling_price||0),lineTotal:Number(p?.selling_price||0)*x.qty};});
  const customer=(liveCustomers||[]).find(c=>String(c.id)===String(customerId));
  button.disabled=true;button.textContent='Processing…';message.textContent='';
  const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));
  const {data,error}=await db.rpc('create_sale',{p_shop_id:currentShop.id,p_customer_id:customerId,p_payment_method:paymentMethod,p_items:items,p_discount:discount});
  button.disabled=false;button.textContent='Complete sale';
  if(error){message.textContent='Sale was not completed: '+error.message;return;}
  const result=Array.isArray(data)?data[0]:data;
  const receiptNo=result?.receipt_number||result?.receipt_no||result?.sale_id||result?.id||'';
  const pending=paymentMethod==='credit';
  lastReceipt={receiptNo:String(receiptNo||'SALE-'+Date.now()),date:new Date().toLocaleString(),customer:customer?.name||'Walk-in customer',phone:customer?.phone||'',method:paymentMethod,subtotal,discount,total,items:soldItems,status:pending?'PENDING CREDIT APPROVAL':'PAID',cashReceived:paymentMethod==='cash'?Number($('#cash-tendered').value):null,change:paymentMethod==='cash'?Math.max(0,Number($('#cash-tendered').value)-total):null};
  message.textContent=pending?'Credit sale submitted for approval · '+lastReceipt.receiptNo:'Sale completed successfully · '+lastReceipt.receiptNo;
  toast(pending?'Credit sale awaiting approval.':'Sale saved to BAJAJ database.');
  await loadReceiptSettings();
  renderReceipt();
  cart=[];await refreshPOSProducts();renderCart();await loadPOSCustomers();
  if($('#pos-discount'))$('#pos-discount').value='0';
  if($('#cash-tendered'))$('#cash-tendered').value='';
  renderCart();
}

let liveSales=[];
function saleLabel(s){return s.receipt_number||s.receipt_no||String(s.id).slice(0,8)}

async function loadLiveSales(){

  filterLiveSales();

function filterLiveSales(){
  const target=$('#live-sales-table');if(!target)return;
  const q=($('#sales-search')?.value||'').toLowerCase();
  const from=$('#sales-from')?.value||'',to=$('#sales-to')?.value||'',method=$('#sales-method')?.value||'',status=$('#sales-status')?.value||'';
  const rows=liveSales.filter(s=>{
    const haystack=(String(saleLabel(s))+' '+customerLabel(s.customer_id)+' '+String(s.status)+' '+String(s.payment_status||'')).toLowerCase();
    const date=s.sold_at?new Date(s.sold_at).toISOString().slice(0,10):'';
    return haystack.includes(q)&&(!from||date>=from)&&(!to||date<=to)&&(!method||s.payment_method===method)&&(!status||s.status===status);
  });
  $('#sales-count').textContent=rows.length+' transactions';
  target.innerHTML=rows.length?'<table><thead><tr><th>Receipt</th><th>Customer</th><th>Date</th><th>Total</th><th>Sale status</th><th>Payment</th><th>Actions</th></tr></thead><tbody>'+rows.map(s=>{
    const action=s.status==='completed'?'<button class="danger" onclick="voidSale(\''+safeText(s.id)+'\')">Cancel / refund</button>':s.status==='pending_approval'?'<button class="danger" onclick="rejectCreditSale(\''+safeText(s.id)+'\')">Reject</button>':'—';
    return '<tr><td><b>'+safeText(saleLabel(s))+'</b></td><td>'+safeText(customerLabel(s.customer_id))+'</td><td>'+safeText(s.sold_at?new Date(s.sold_at).toLocaleString():'—')+'</td><td><b>'+money(Number(s.total||0))+'</b></td><td><span class="badge '+(s.status==='pending_approval'?'warn':'')+'">'+safeText(s.status||'—')+'</span></td><td>'+safeText(s.payment_status||s.payment_method||'—')+'</td><td>'+action+'</td></tr>';
  }).join('')+'</tbody></table>':'<div class="empty">No matching transactions.</div>';
}
async function approveCreditSale(id){
  if(!confirm('Approve this credit sale? Stock will be deducted now.'))return;
  const {data,error}=await db.rpc('approve_credit_sale',{p_sale_id:id});
  if(error){toast('Approval failed: '+error.message);return;}
  toast('Credit sale approved and stock deducted.');await loadLiveSales();await refreshPOSProducts();
}
async function rejectCreditSale(id){
  const reason=prompt('Reason for rejecting this credit request:','Credit request declined');
  if(reason===null)return;
  if(!reason.trim()){toast('A rejection reason is required.');return;}
  const {error}=await db.rpc('reject_credit_sale',{p_sale_id:id,p_reason:reason.trim()});
  if(error){toast('Could not reject credit sale: '+error.message);return;}
  toast('Credit request rejected.');await loadLiveSales();
}
async function voidSale(id){
  const sale=liveSales.find(x=>String(x.id)===String(id));
  if(!sale||sale.status!=='completed'){toast('Only completed sales can be cancelled.');return;}
  let refundConfirmed=false;
  if(sale.payment_method==='cash'||sale.payment_method==='card'){
    refundConfirmed=confirm('IMPORTANT: Has the customer already received the full refund outside this system?\n\nChoose OK only after the refund has actually been completed. This action restores stock and marks the sale voided; it does not transfer money.');
    if(!refundConfirmed)return;
  }else{
    if(sale.payment_status==='paid'||sale.payment_status==='partial'){
      toast('This credit sale has repayments. Resolve or reverse those payments before cancelling it.');
      return;
    }
    if(!confirm('Cancel this unpaid credit sale and return its items to stock?'))return;
  }
  const reason=prompt('Reason for cancelling this sale:','Sale cancelled');
  if(reason===null)return;
  if(!reason.trim()){toast('A cancellation reason is required.');return;}
  const {error}=await db.rpc('void_sale',{p_sale_id:id,p_reason:reason.trim(),p_refund_confirmed:refundConfirmed});
  if(error){toast('Cancellation failed: '+error.message);return;}
  toast('Sale cancelled and stock restored.');await loadLiveSales();await refreshPOSProducts();await refreshLiveInventory();
}

function filterLiveCustomers(){

let cachedStockMovements=[];
async function loadStockMovementReport(){
  const el=$('#movement-list');if(!el)return;
  const from=$('#movement-from')?.value,to=$('#movement-to')?.value;
  if(!from||!to||from>to){el.innerHTML='<div class="notice">Choose a valid date range.</div>';return;}
  const start=new Date(from+'T00:00:00').toISOString(),end=new Date(new Date(to+'T00:00:00').getTime()+86400000).toISOString();
  el.innerHTML='<p class="muted">Loading movement history…</p>';
  const [{data,error},productsNow]=await Promise.all([db.from('inventory_movements').select('*').eq('shop_id',currentShop.id).gte('created_at',start).lt('created_at',end).order('created_at',{ascending:false}).limit(1000),loadLiveInventory()]);
  if(error){el.innerHTML='<div class="notice">Could not load movements: '+safeText(error.message)+'</div>';return;}
  cachedStockMovements=data||[];
  const total=cachedStockMovements.reduce((n,m)=>n+Number(m.quantity_change||0),0);
  el.innerHTML='<div class="stats"><div class="stat"><div class="stathead">Movement records</div><strong>'+cachedStockMovements.length+'</strong></div><div class="stat"><div class="stathead">Net quantity change</div><strong>'+ (total>0?'+':'')+total+'</strong></div></div>'+
  (cachedStockMovements.length?'<div class="tablecard"><table><thead><tr><th>Date</th><th>Product</th><th>Movement</th><th>Quantity change</th><th>Notes</th></tr></thead><tbody>'+cachedStockMovements.map(m=>'<tr><td>'+new Date(m.created_at).toLocaleString()+'</td><td>'+safeText(productsNow.find(p=>p.id===m.product_id)?.product_name||m.product_id)+'</td><td>'+safeText(m.movement_type)+'</td><td>'+(Number(m.quantity_change)>0?'+':'')+Number(m.quantity_change)+'</td><td>'+safeText(m.notes||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No stock movements in this date range.</div>');
}
function exportStockMovementReport(){
  if(!cachedStockMovements.length){toast('There are no movement records to export.');return;}
  downloadCSV('bajaj-stock-movements.csv',[['date','product_id','movement_type','quantity_change','notes'],...cachedStockMovements.map(m=>[m.created_at,m.product_id,m.movement_type,m.quantity_change,m.notes||''])]);
}

async function createPurchaseOrder(){
  const msg=$('#purchase-message'),supplierId=$('#po-supplier')?.value;
  const lines=[...document.querySelectorAll('#purchase-lines .formrow')].map(row=>({product_id:row.querySelector('.po-product').value,quantity_ordered:Number(row.querySelector('.po-qty').value),unit_cost:Number(row.querySelector('.po-cost').value)}));
  if(!supplierId){msg.textContent='Choose a supplier.';return;}
  if(!lines.length||lines.some(x=>!x.product_id||!Number.isInteger(x.quantity_ordered)||x.quantity_ordered<1||!Number.isFinite(x.unit_cost)||x.unit_cost<0)){msg.textContent='Add valid product, quantity and unit cost details to every line.';return;}
  const subtotal=lines.reduce((a,x)=>a+x.quantity_ordered*x.unit_cost,0);
  const {data:order,error}=await db.from('purchase_orders').insert({shop_id:currentShop.id,supplier_id:supplierId,reference_no:$('#po-reference').value.trim()||null,status:'draft',subtotal,notes:$('#po-notes').value.trim()||null,created_by:currentUser.id}).select().single();
  if(error){msg.textContent='Could not create purchase order: '+error.message;return;}
  const {error:itemError}=await db.from('purchase_items').insert(lines.map(x=>({...x,purchase_id:order.id})));
  if(itemError){await db.from('purchase_orders').delete().eq('id',order.id);msg.textContent='Could not save purchase lines: '+itemError.message;return;}
  toast('Purchase order saved.');await loadSupplierData();showSupplierTab('purchases');
}
function updatePurchaseTotal(){
  const total=[...document.querySelectorAll('#purchase-lines .formrow')].reduce((a,row)=>a+Number(row.querySelector('.po-qty').value||0)*Number(row.querySelector('.po-cost').value||0),0);

async function loadShiftWorkspace(){

    if(error){current.innerHTML='<div class="notice">Could not calculate shift cash: '+safeText(error.message)+'</div>';return;}
    const cashSales=(sales||[]).reduce((n,x)=>n+Number(x.total||0),0);

      '<form id="close-shift-form" class="formrow" style="align-items:end"><div class="field"><label>Actual cash counted (LKR)</label><input name="closing_cash" type="number" min="0" step="0.01" required placeholder="Count the till"></div><div class="field"><label>Closing note (optional)</label><input name="closing_note" maxlength="500" placeholder="e.g. counted with manager"></div><button class="primary" type="submit">Close shift & reconcile</button></form><div id="shift-message" class="muted"></div>';
    $('#close-shift-form').addEventListener('submit',closeCashierShift);

    current.innerHTML='<div class="cardhead"><h3>No open shift</h3><span class="badge">READY</span></div><p class="muted">Enter the cash physically in the till before starting sales. One open shift is allowed per cashier per shop.</p>'+

    $('#open-shift-form').addEventListener('submit',openCashierShift);
  }
  const {data:rows,error}=await db.from('cashier_shifts').select('*').eq('shop_id',currentShop.id).order('opened_at',{ascending:false}).limit(30);
  if(error){history.innerHTML='<div class="notice">Could not load shift history: '+safeText(error.message)+'</div>';return;}
  history.innerHTML=rows?.length?'<table><thead><tr><th>Cashier ID</th><th>Opened</th><th>Closed</th><th>Opening</th><th>Expected</th><th>Counted</th><th>Difference</th><th>Status</th></tr></thead><tbody>'+
    rows.map(x=>'<tr><td>'+safeText(String(x.cashier_id).slice(0,8))+'…</td><td>'+safeText(new Date(x.opened_at).toLocaleString())+'</td><td>'+safeText(x.closed_at?new Date(x.closed_at).toLocaleString():'—')+'</td><td>'+money(x.opening_cash)+'</td><td>'+money(x.expected_cash??0)+'</td><td>'+money(x.closing_cash??0)+'</td><td><b>'+ (x.cash_difference===null?'—':money(x.cash_difference))+'</b></td><td><span class="badge '+(x.status==='open'?'warn':'')+'">'+safeText(x.status)+'</span></td></tr>').join('')+'</tbody></table>':'<div class="empty">No cashier shifts have been recorded yet.</div>';

async function openCashierShift(event){

  const amount=Number(form.elements.opening_cash.value);
  if(!Number.isFinite(amount)||amount<0){msg.textContent='Enter a valid non-negative opening amount.';return;}

async function closeCashierShift(event){

  const form=event.currentTarget,msg=$('#shift-message'),button=form.querySelector('button');
  const amount=Number(form.elements.closing_cash.value),note=form.elements.closing_note.value.trim();

  button.disabled=true;button.textContent='Closing…';

  const result=Array.isArray(data)?data[0]:data;

function localDateInputValue(date=new Date()){
  const offset=date.getTimezoneOffset()*60000;
  return new Date(date.getTime()-offset).toISOString().slice(0,10);
}
async function loadCashierPerformance(){
  const host=$('#cashier-performance-content'),date=$('#cashier-report-date')?.value;
  if(!host||!date)return;
  host.innerHTML='<p class="muted">Calculating cashier totals…</p>';
  const start=new Date(date+'T00:00:00').toISOString(),end=new Date(new Date(date+'T00:00:00').getTime()+86400000).toISOString();
  const [shiftResult,salesResult]=await Promise.all([
    db.from('cashier_shifts').select('*').eq('shop_id',currentShop.id).gte('opened_at',start).lt('opened_at',end).order('opened_at',{ascending:false}),
    db.from('sales').select('id,shift_id,total,status,payment_method,sold_at').eq('shop_id',currentShop.id).gte('sold_at',start).lt('sold_at',end)
  ]);
  if(shiftResult.error){host.innerHTML='<div class="notice">Could not load cashier shifts: '+safeText(shiftResult.error.message)+'</div>';return;}
  if(salesResult.error){host.innerHTML='<div class="notice">Could not load cashier sales: '+safeText(salesResult.error.message)+'</div>';return;}
  const shifts=shiftResult.data||[],sales=salesResult.data||[];
  const completed=sales.filter(x=>x.status==='completed');
  const total=rows=>rows.reduce((n,x)=>n+Number(x.total||0),0);
  const cash=completed.filter(x=>x.payment_method==='cash');
  const card=completed.filter(x=>x.payment_method==='card');
  const credit=completed.filter(x=>x.payment_method==='credit');
  const closed=shifts.filter(x=>x.status==='closed');
  const open=shifts.filter(x=>x.status==='open');
  const difference=closed.reduce((n,x)=>n+Number(x.cash_difference||0),0);
  const cashierIds=[...new Set(shifts.map(x=>x.cashier_id))];
  const byCashier=cashierIds.map(id=>{
    const own=shifts.filter(x=>x.cashier_id===id),ids=own.map(x=>x.id);
    const ownSales=completed.filter(x=>ids.includes(x.shift_id));
    const ownCash=ownSales.filter(x=>x.payment_method==='cash');
    return {id,shifts:own.length,sales:ownSales.length,total:total(ownSales),cash:total(ownCash),difference:own.filter(x=>x.status==='closed').reduce((n,x)=>n+Number(x.cash_difference||0),0)};
  }).sort((a,b)=>b.total-a.total);
  host.innerHTML='<div class="stats">'+
    '<div class="stat"><div class="stathead">Completed sales</div><strong>'+money(total(completed))+'</strong><small class="muted">'+completed.length+' transactions</small></div>'+
    '<div class="stat"><div class="stathead">Cash sales</div><strong>'+money(total(cash))+'</strong><small class="muted">'+cash.length+' transactions</small></div>'+
    '<div class="stat"><div class="stathead">Card / credit sales</div><strong>'+money(total(card)+total(credit))+'</strong><small class="muted">'+(card.length+credit.length)+' transactions</small></div>'+
    '<div class="stat"><div class="stathead">Cash difference</div><strong>'+money(difference)+'</strong><small class="muted">'+closed.length+' closed · '+open.length+' open shifts</small></div></div>'+
    '<div class="grid2"><div class="card"><div class="cardhead"><h3>Payment summary</h3></div><div class="cartline"><span>Cash</span><b>'+money(total(cash))+'</b></div><div class="cartline"><span>Card</span><b>'+money(total(card))+'</b></div><div class="cartline"><span>Credit</span><b>'+money(total(credit))+'</b></div><div class="cartline"><span>Pending credit approvals</span><b>'+sales.filter(x=>x.status==='pending_approval').length+'</b></div></div>'+
    '<div class="card"><div class="cardhead"><h3>Shift reconciliation</h3></div><div class="cartline"><span>Shifts opened</span><b>'+shifts.length+'</b></div><div class="cartline"><span>Closed shifts</span><b>'+closed.length+'</b></div><div class="cartline"><span>Still open</span><b>'+open.length+'</b></div><div class="cartline"><span>Net shortage / excess</span><b>'+money(difference)+'</b></div></div></div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Cashier performance</h3><span>'+byCashier.length+' cashiers</span></div>'+
    (byCashier.length?'<div class="tablecard"><table><thead><tr><th>Cashier ID</th><th>Shifts</th><th>Transactions</th><th>Sales value</th><th>Cash sales</th><th>Net difference</th></tr></thead><tbody>'+byCashier.map(x=>'<tr><td><code>'+safeText(x.id.slice(0,8))+'…</code></td><td>'+x.shifts+'</td><td>'+x.sales+'</td><td><b>'+money(x.total)+'</b></td><td>'+money(x.cash)+'</td><td>'+money(x.difference)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No cashier shifts were opened on this date.</div>')+'</div>'+

async function loadProfitReport(){
  const host=$('#live-report-content');if(!host)return;
  const from=$('#profit-from')?.value||'',to=$('#profit-to')?.value||'';
  const msg=$('#profit-range-message');
  if(!from||!to||from>to){if(msg)msg.textContent='Choose a valid date range.';return;}
  if(msg)msg.textContent='Loading sales and product analytics…';
  const start=new Date(from+'T00:00:00').toISOString(),end=new Date(new Date(to+'T00:00:00').getTime()+86400000).toISOString();
  const [salesResult,itemsResult,productsResult]=await Promise.all([
    db.from('sales').select('id,total,subtotal,discount,status,sold_at,payment_method,payment_status').eq('shop_id',currentShop.id).eq('status','completed').gte('sold_at',start).lt('sold_at',end).order('sold_at',{ascending:false}),
    db.from('sale_items').select('sale_id,product_id,product_name,product_code,quantity,unit_price,unit_cost,line_total,sales!inner(shop_id,status,sold_at)').eq('sales.shop_id',currentShop.id).eq('sales.status','completed').gte('sales.sold_at',start).lt('sales.sold_at',end),
    loadLiveInventory()
  ]);
  if(salesResult.error||itemsResult.error){host.innerHTML='<div class="notice">Could not load analytics: '+safeText(salesResult.error?.message||itemsResult.error?.message)+'</div>';if(msg)msg.textContent='Report could not be loaded.';return;}
  const sales=salesResult.data||[],items=itemsResult.data||[],products=productsResult||[];
  const saleById=new Map(sales.map(s=>[s.id,s]));
  const validItems=items.filter(i=>saleById.has(i.sale_id));
  const missingCosts=validItems.filter(i=>i.unit_cost===null||i.unit_cost===undefined);
  const productMap=new Map(),dailyMap=new Map(),monthlyMap=new Map();
  let costOfGoods=0,itemRevenue=0;
  for(const item of validItems){
    const sale=saleById.get(item.sale_id);
    const qty=Number(item.quantity||0);
    const lineGross=Number(item.line_total??(Number(item.unit_price||0)*qty));
    const saleSubtotal=Number(sale.subtotal||0);
    const discount=Number(sale.discount||0);
    const allocatedDiscount=saleSubtotal>0?discount*(lineGross/saleSubtotal):0;
    const netLine=lineGross-allocatedDiscount;
    const lineCost=Number(item.unit_cost||0)*qty;
    const lineProfit=netLine-lineCost;
    itemRevenue+=netLine;costOfGoods+=lineCost;
    const key=String(item.product_id||item.product_code||item.product_name);
    const p=productMap.get(key)||{name:item.product_name||'Unnamed product',code:item.product_code||'—',units:0,revenue:0,cost:0,profit:0,missingCost:false};
    p.units+=qty;p.revenue+=netLine;p.cost+=lineCost;p.profit+=lineProfit;
    if(item.unit_cost===null||item.unit_cost===undefined)p.missingCost=true;
    productMap.set(key,p);
    const date=sale.sold_at?localDateInputValue(new Date(sale.sold_at)):from;
    const day=dailyMap.get(date)||{date,revenue:0,cost:0,profit:0,transactions:new Set()};
    day.revenue+=netLine;day.cost+=lineCost;day.profit+=lineProfit;day.transactions.add(sale.id);dailyMap.set(date,day);
    const month=date.slice(0,7);
    const mon=monthlyMap.get(month)||{month,revenue:0,cost:0,profit:0,transactions:new Set()};
    mon.revenue+=netLine;mon.cost+=lineCost;mon.profit+=lineProfit;mon.transactions.add(sale.id);monthlyMap.set(month,mon);
  }
  const revenue=sales.reduce((sum,s)=>sum+Number(s.total||0),0);
  const grossProfit=revenue-costOfGoods;
  const margin=revenue>0?(grossProfit/revenue)*100:0;
  const stockValue=products.reduce((sum,p)=>sum+Number(p.quantity||0)*Number(p.cost_price||0),0);
  const low=products.filter(p=>Number(p.quantity||0)<=Number(p.low_stock_threshold??5));
  const pendingNote='Pending credit approvals and voided sales are excluded.';
  const methods=['cash','card','credit'].map(method=>({method,count:sales.filter(x=>x.payment_method===method).length,value:sales.filter(x=>x.payment_method===method).reduce((n,x)=>n+Number(x.total||0),0)}));
  const topProfit=[...productMap.values()].sort((a,b)=>b.profit-a.profit).slice(0,10);
  const topUnits=[...productMap.values()].sort((a,b)=>b.units-a.units).slice(0,10);
  const daily=[...dailyMap.values()].sort((a,b)=>a.date.localeCompare(b.date));
  const monthly=[...monthlyMap.values()].sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);
  const missingNotice=missingCosts.length?'<div class="notice">Warning: '+missingCosts.length+' sold item rows have no saved cost. Profit figures are incomplete until those historical costs are corrected.</div>':'';
  const productRows=rows=>rows.length?'<div class="tablecard"><table><thead><tr><th>Spare part</th><th>Code</th><th>Units sold</th><th>Net sales</th><th>COGS</th><th>Gross profit</th><th>Margin</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+safeText(p.name)+'</b>'+(p.missingCost?' <span class="badge warn">Missing cost</span>':'')+'</td><td>'+safeText(p.code)+'</td><td>'+p.units+'</td><td>'+money(p.revenue)+'</td><td>'+money(p.cost)+'</td><td><b>'+money(p.profit)+'</b></td><td>'+ (p.revenue>0?(p.profit/p.revenue*100).toFixed(1):'0.0')+'%</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No completed sale items in this date range.</div>';
  const maxDaily=Math.max(1,...daily.map(x=>x.revenue));
  const trendBars=daily.slice(-14).map(x=>'<div class="barwrap" title="'+safeText(x.date)+' · '+money(x.revenue)+'"><div class="bar" style="height:'+Math.max(4,(x.revenue/maxDaily)*100)+'%"></div><small>'+safeText(x.date.slice(5))+'</small></div>').join('');
  host.innerHTML=missingNotice+
    '<div class="stats">'+
    '<div class="stat"><div class="stathead">Sales after discounts</div><strong>'+money(revenue)+'</strong><small class="muted">'+sales.length+' completed transactions</small></div>'+
    '<div class="stat"><div class="stathead">Cost of goods sold</div><strong>'+money(costOfGoods)+'</strong><small class="muted">Sale-time unit costs</small></div>'+
    '<div class="stat"><div class="stathead">Gross profit</div><strong>'+money(grossProfit)+'</strong><small class="muted">'+margin.toFixed(1)+'% gross margin</small></div>'+
    '<div class="stat"><div class="stathead">Current stock value</div><strong>'+money(stockValue)+'</strong><small class="muted">'+products.length+' products · '+low.length+' low stock</small></div></div>'+
    '<div class="grid2"><div class="card"><div class="cardhead"><h3>Payment method breakdown</h3><span>Selected period</span></div><table><thead><tr><th>Method</th><th>Transactions</th><th>Sales value</th></tr></thead><tbody>'+methods.map(m=>'<tr><td>'+safeText(m.method.toUpperCase())+'</td><td>'+m.count+'</td><td>'+money(m.value)+'</td></tr>').join('')+'</tbody></table></div>'+
    '<div class="card"><div class="cardhead"><h3>Profit calculation</h3></div><div class="cartline"><span>Sales after discounts</span><b>'+money(revenue)+'</b></div><div class="cartline"><span>Less: cost of goods sold</span><b>'+money(costOfGoods)+'</b></div><div class="cartline"><strong>Gross profit</strong><strong>'+money(grossProfit)+'</strong></div><p class="muted">'+pendingNote+'</p></div></div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Sales trend · daily</h3><span>Last 14 days in selected range</span></div>'+(daily.length?'<div class="chart">'+trendBars+'</div>':'<div class="empty">No sales in this period.</div>')+'</div>'+
    '<div class="grid2" style="margin-top:16px"><div class="card"><div class="cardhead"><h3>Top sellers by quantity</h3><span>Top 10</span></div>'+productRows(topUnits)+'</div><div class="card"><div class="cardhead"><h3>Most profitable products</h3><span>Top 10 by gross profit</span></div>'+productRows(topProfit)+'</div></div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Monthly performance</h3><span>Up to 12 months in selected range</span></div>'+(monthly.length?'<div class="tablecard"><table><thead><tr><th>Month</th><th>Net sales</th><th>COGS</th><th>Gross profit</th><th>Transactions</th></tr></thead><tbody>'+monthly.map(x=>'<tr><td>'+safeText(x.month)+'</td><td>'+money(x.revenue)+'</td><td>'+money(x.cost)+'</td><td><b>'+money(x.profit)+'</b></td><td>'+x.transactions.size+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No monthly data yet.</div>')+'</div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Low-stock watchlist</h3><span>'+low.length+' products</span></div>'+(low.length?'<div class="tablecard"><table><thead><tr><th>Product</th><th>Code</th><th>In stock</th><th>Alert at</th></tr></thead><tbody>'+low.map(p=>'<tr><td><b>'+safeText(p.product_name)+'</b></td><td>'+safeText(p.product_code)+'</td><td><span class="badge warn">'+Number(p.quantity||0)+'</span></td><td>'+Number(p.low_stock_threshold??5)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No products are currently below their alert threshold.</div>')+'</div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Daily cashier & cash summary</h3><input id="cashier-report-date" type="date" value="'+localDateInputValue()+'" onchange="loadCashierPerformance()"></div><div id="cashier-performance-content"><p class="muted">Loading cashier report…</p></div></div>'+
    '<div class="card" style="margin-top:16px"><div class="cardhead"><h3>Export analytics</h3><button class="secondary" id="export-analytics">Download CSV</button></div><p class="muted">Exports product profitability, daily sales/profit and monthly performance for the selected date range.</p></div>';
  $('#export-analytics').addEventListener('click',()=>{
    const rows=[['Section','Name / Date','Product code','Units','Net sales','Cost of goods','Gross profit','Transactions']];
    for(const p of productMap.values())rows.push(['Product',p.name,p.code,p.units,p.revenue,p.cost,p.profit,'']);
    for(const d of daily)rows.push(['Daily',d.date,'','',d.revenue,d.cost,d.profit,d.transactions.size]);
    for(const m of monthly)rows.push(['Monthly',m.month,'','',m.revenue,m.cost,m.profit,m.transactions.size]);
    const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bajaj-analytics-'+from+'-to-'+to+'.csv';a.click();URL.revokeObjectURL(url);
  });
  if(msg)msg.textContent='Analytics updated for '+from+' to '+to+'.';
}

async function changeShopMemberRole(id,currentRole){
  const choices=isPlatformAdmin?'sub_admin or pos_user':'pos_user';const next=prompt('Enter new role: '+choices,currentRole);if(next===null)return;
  if(!['sub_admin','pos_user'].includes(next.trim())||(!isPlatformAdmin&&next.trim()!=='pos_user')){alert('This account can only assign POS users.');return;}
  const {error}=await db.from('shop_members').update({role:next.trim()}).eq('id',id).eq('shop_id',currentShop.id);
  if(error){alert('Could not update role: '+error.message);return;}await loadShopMembers();toast('Shop role updated.');
}
async function removeShopMember(id){
  if(!confirm('Remove this user from the current shop? Their login account will not be deleted.'))return;
  const {error}=await db.from('shop_members').delete().eq('id',id).eq('shop_id',currentShop.id);
  if(error){alert('Could not remove user: '+error.message);return;}await loadShopMembers();toast('User removed from this shop.');
}
async function settingsPage(){
  $('#view').innerHTML=heading('SHOP CONFIGURATION','Business settings','Update the business details used across this shop and on customer receipts.')+
  '<div class="card"><div class="cardhead"><h3>Business profile</h3><span>Saved to this shop</span></div><form id="business-settings-form" class="formrow" style="align-items:end">'+
  '<div class="field"><label>Business display name</label><input name="name" required maxlength="120"></div>'+
  '<div class="field"><label>Phone number</label><input name="business_phone" maxlength="40" placeholder="Business contact"></div>'+
  '<div class="field"><label>Receipt prefix</label><input name="receipt_prefix" required maxlength="10" placeholder="BAJ"></div>'+
  '<div class="field"><label>Business address</label><input name="business_address" maxlength="250" placeholder="Shop address"></div>'+
  '<div class="field"><label>Receipt footer</label><input name="receipt_footer" maxlength="250" placeholder="Thank you for your purchase"></div>'+
  '<div class="field"><label>Logo image URL (optional)</label><input name="logo_url" type="url" maxlength="500" placeholder="https://..."></div>'+
  '<button class="primary" type="submit">Save business profile</button></form><div id="business-settings-message" class="muted" style="margin-top:8px">Loading saved settings…</div></div>'+
  '<div class="card" style="margin-top:16px"><h3>Appearance</h3><p class="muted">Use the theme button in the sidebar to switch between dark and light mode.</p></div>'+
  '<div class="card" style="margin-top:16px"><h3>Hardware compatibility</h3><p class="muted">USB barcode scanner · ESC/POS thermal receipt printer · PDF receipt export · WhatsApp sharing (production integration)</p></div>';
  const form=$('#business-settings-form'),msg=$('#business-settings-message');
  const {data,error}=await db.from('shops').select('id,name,business_phone,business_address,receipt_prefix,receipt_footer,logo_url').eq('id',currentShop.id).single();
  if(error){msg.textContent='Could not load shop settings: '+error.message;return;}
  for(const key of ['name','business_phone','business_address','receipt_prefix','receipt_footer','logo_url']) form.elements[key].value=data[key]|| (key==='receipt_prefix'?'BAJ':'');
  msg.textContent='Settings loaded.';
  form.addEventListener('submit',async event=>{
    event.preventDefault();const v=Object.fromEntries(new FormData(form).entries());
    const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Saving…';msg.textContent='';
    const {data:updated,error:saveError}=await db.rpc('update_shop_settings',{
      p_shop_id:currentShop.id,p_name:v.name,p_business_phone:v.business_phone||null,
      p_business_address:v.business_address||null,p_receipt_prefix:v.receipt_prefix,
      p_receipt_footer:v.receipt_footer||null,p_logo_url:v.logo_url||null
    });
    button.disabled=false;button.textContent='Save business profile';
    if(saveError){msg.textContent='Could not save settings: '+saveError.message;return;}
    currentShop={...currentShop,...updated};
    document.querySelector('.sidefoot span').textContent=currentShop.name+' · Supabase connected';
    msg.textContent='Business profile saved successfully.';toast('Shop settings saved.');
  });
}

initializeApp();
</script>
</body></html>
